<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- blocking on purpose: applies the theme class before first paint,
         otherwise dark-mode users get a white flash on every load -->
    <script>
      ;(() => {
        const saved = localStorage.getItem('theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <title>PoseGraft — The Robot Simulator Built for Agents</title>
    <meta
      name="description"
      content="PoseGraft is the first robot simulation studio built for AI agents and the humans who work with them. Design your scene, build robotic logic, and let agents do the rest."
    />
    <meta property="og:title" content="PoseGraft — The Robot Simulator Built for Agents" />
    <meta
      property="og:description"
      content="Design your scene. Build robotic logic. Frontend optimized for humans, backend built for AI agents — Enhanced MCP, gRPC, and SDK access to every feature."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
